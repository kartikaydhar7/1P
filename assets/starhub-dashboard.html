<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarHub Account Intelligence</title>
<meta name="description" content="Signal enrichment across StarHub's net-new Singapore enterprise portfolio: account prioritisation, buying signals and target-contact coverage.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#141811" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F5EF" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<script>(function(){var q=new URLSearchParams(location.search);if(q.has('embed'))document.documentElement.setAttribute('data-embed','1');var t=q.get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="icon" href="starhub-mark.png" type="image/png">
<link rel="apple-touch-icon" href="starhub-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ================================================================
   StarHub Account Intelligence — design tokens
   Ordinal ramps validated for lightness monotonicity, adjacent dL
   and light-end contrast in both themes.
   ================================================================ */
:root{
  color-scheme:light;
  /* brand */
  --brand:#5CA22B; --brand-str:#3E8318; --brand-lite:#82C341; --brand-soft:#EDF6E2;
  --accent:#10808E; --accent-str:#0C6B78; --accent-lite:#3FA9B6; --accent-soft:#E2F2F4;
  /* priority ordinal ramp (P0 strongest -> P3), unranked neutral */
  --p0:#24580F; --p1:#3E8318; --p2:#63A82B; --p3:#8CBF45; --pu:#AEB4A8; --pn:#C6CBC2;
  --p0-ink:#FFFFFF; --p1-ink:#FFFFFF; --p2-ink:#0B1206; --p3-ink:#0B1206; --pu-ink:#0B1206; --pn-ink:#0B1206;
  /* account-tier ordinal ramp, teal (contacts board) */
  --t0:#095864; --t1:#0C6B78; --t2:#10808E; --t3:#1F95A3;
  --t0-ink:#FFFFFF; --t1-ink:#FFFFFF; --t2-ink:#FFFFFF; --t3-ink:#FFFFFF;
  /* seniority ordinal ramp (C-suite strongest -> IC) */
  --s0:#095864; --s1:#0C6B78; --s2:#10808E; --s3:#1F95A3; --s4:#3FA9B6; --s5:#5EBCC7;
  /* neutrals, biased a few degrees toward the brand hue */
  --ink:#151A13; --ink-2:#4A5147; --muted:#6C7568;
  --line:#E5EAE0; --line-2:#F0F3EC; --track:#EBEFE6;
  --bg:#F2F5EF; --card:#FFFFFF; --card-2:#FAFCF7;
  --mast:#141811; --mast-2:#252C21; --mast-3:#323A2C; --mast-ink:#F2F5EF; --mast-mut:#98A192;
  --shadow:0 1px 2px rgba(18,24,14,.04),0 6px 20px rgba(18,24,14,.06);
  --shadow-lift:0 1px 2px rgba(18,24,14,.05),0 10px 30px rgba(18,24,14,.10);
  --f:'Figtree','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  --fm:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --brand:#8FCB4E; --brand-str:#A6D96B; --brand-lite:#8FCB4E; --brand-soft:#1E2C18;
    --accent:#3FA9B6; --accent-str:#5EBCC7; --accent-lite:#73D0D9; --accent-soft:#12282B;
    --p0:#C3E29A; --p1:#97CC58; --p2:#6BAE33; --p3:#4E8B22; --pu:#5B6357; --pn:#3C4239;
    --p0-ink:#0B1206; --p1-ink:#0B1206; --p2-ink:#0B1206; --p3-ink:#0B1206; --pu-ink:#EDF1E9; --pn-ink:#EDF1E9;
    --t0:#45BAC7; --t1:#25A3B3; --t2:#18899A; --t3:#12707C;
    --t0-ink:#04191C; --t1-ink:#04191C; --t2-ink:#EDF1E9; --t3-ink:#EDF1E9;
    --t0:#45BAC7; --t1:#25A3B3; --t2:#18899A; --t3:#12707C;
  --t0-ink:#04191C; --t1-ink:#04191C; --t2-ink:#EDF1E9; --t3-ink:#EDF1E9;
  --s0:#A6E2E9; --s1:#73D0D9; --s2:#45BAC7; --s3:#25A3B3; --s4:#18899A; --s5:#12707C;
    --ink:#EDF1E9; --ink-2:#AFB7AB; --muted:#8A9387;
    --line:#282E26; --line-2:#1F251E; --track:#232922;
    --bg:#0F120E; --card:#181C17; --card-2:#1D221C;
    --mast:#080A07; --mast-2:#1C221A; --mast-3:#283024; --mast-ink:#EDF1E9; --mast-mut:#868F82;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.34);
    --shadow-lift:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.44);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand:#8FCB4E; --brand-str:#A6D96B; --brand-lite:#8FCB4E; --brand-soft:#1E2C18;
  --accent:#3FA9B6; --accent-str:#5EBCC7; --accent-lite:#73D0D9; --accent-soft:#12282B;
  --p0:#C3E29A; --p1:#97CC58; --p2:#6BAE33; --p3:#4E8B22; --pu:#5B6357; --pn:#3C4239;
  --p0-ink:#0B1206; --p1-ink:#0B1206; --p2-ink:#0B1206; --p3-ink:#0B1206; --pu-ink:#EDF1E9; --pn-ink:#EDF1E9;
  --s0:#A6E2E9; --s1:#73D0D9; --s2:#45BAC7; --s3:#25A3B3; --s4:#18899A; --s5:#12707C;
  --ink:#EDF1E9; --ink-2:#AFB7AB; --muted:#8A9387;
  --line:#282E26; --line-2:#1F251E; --track:#232922;
  --bg:#0F120E; --card:#181C17; --card-2:#1D221C;
  --mast:#080A07; --mast-2:#1C221A; --mast-3:#283024; --mast-ink:#EDF1E9; --mast-mut:#868F82;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.34);
  --shadow-lift:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.44);
}
/* contacts mode retints the interactive chrome to the teal accent */
body[data-mode="contacts"]{--brand:var(--accent);--brand-str:var(--accent-str);--brand-lite:var(--accent-lite);--brand-soft:var(--accent-soft)}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;
     -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-bottom:56px}
::selection{background:var(--brand);color:#fff}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------------- masthead ---------------- */
header.top{background:var(--mast);color:var(--mast-ink);position:sticky;top:0;z-index:60}
.top-inner{max-width:1440px;margin:0 auto;padding:15px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:30px;width:auto;flex:none;display:block}
@media(max-width:700px){.logo{height:26px}}
.htitle{font-size:15.5px;font-weight:700;letter-spacing:-.1px;line-height:1.2}
.hsub{font-size:11.5px;color:var(--mast-mut);margin-top:3px;letter-spacing:.2px;font-weight:500}
.modes{margin-left:auto;display:flex;background:var(--mast-2);border-radius:11px;padding:4px;gap:3px}
.modes button{border:0;background:transparent;color:var(--mast-mut);font-family:var(--f);font-weight:600;font-size:13px;
  padding:9px 20px;border-radius:8px;cursor:pointer;transition:.18s;white-space:nowrap;display:flex;align-items:center;gap:8px}
.modes button:hover{color:var(--mast-ink);background:var(--mast-3)}
.modes button .n{font-family:var(--fm);font-size:10.5px;font-weight:600;opacity:.66}
.modes-sep{width:1px;align-self:stretch;background:var(--mast-3);margin:0 3px;flex:none}
.modes button.active{background:var(--brand-lite);color:#0B1206}
.modes button.active .n{opacity:.72}
body[data-mode="contacts"] .modes button.active{background:var(--accent-lite);color:#04191C}

/* ---------------- filter rail ---------------- */
.filters{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:70px;z-index:55}
.filters-inner{max-width:1440px;margin:0 auto;padding:13px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fgroup{position:relative}
.fbtn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;font-family:var(--f);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
.fbtn:hover{border-color:var(--muted);background:var(--card-2)}
.fbtn.has{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-str)}
.fbtn .lbl{color:var(--muted);font-weight:500}
.fbtn.has .lbl{color:var(--brand-str)}
.fbtn .cnt{background:var(--brand);color:var(--card);border-radius:20px;font-family:var(--fm);font-size:10px;font-weight:600;padding:2px 7px;min-width:18px;text-align:center}
.caret{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.5}
.fbtn.adv .advic{color:var(--brand);font-size:13px;line-height:1}
.panel{position:absolute;top:calc(100% + 8px);left:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lift);width:330px;max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:.16s;z-index:70}
.panel.open{max-height:460px;opacity:1;pointer-events:auto}
.panel.adv{width:min(660px,92vw)}
.panel.adv.open{max-height:620px}
.adv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.adv-head .t{font-size:13px;font-weight:700}
.adv-head .t .d{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px;line-height:1.45}
.adv-head .m{text-align:right;white-space:nowrap}
.adv-head .m .v{font-family:var(--fm);font-size:18px;font-weight:600;letter-spacing:-.4px;line-height:1.1}
.adv-head .m .l{font-size:9.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.adv-body{max-height:430px;overflow-y:auto;padding:14px 16px}
.adv-foot{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line-2)}
.panel-search{padding:11px 12px;border-bottom:1px solid var(--line-2)}
.panel-search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:var(--f);
  font-size:12.5px;outline:none;background:var(--card-2);color:var(--ink)}
.panel-search input:focus{border-color:var(--brand)}
.opts{max-height:310px;overflow-y:auto;padding:6px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;transition:.1s}
.opt:hover{background:var(--line-2)}
.opt .box{width:16px;height:16px;border:2px solid var(--muted);border-radius:5px;flex:none;position:relative;transition:.12s}
.opt.on .box{background:var(--brand);border-color:var(--brand)}
.opt.on .box:after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border-right:2px solid var(--card);border-bottom:2px solid var(--card);transform:rotate(45deg)}
.opt .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.ph .nm{color:var(--muted);font-style:italic}
.opt .qty{color:var(--muted);font-family:var(--fm);font-size:10.5px;font-weight:500}
.panel-foot{display:flex;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line-2)}
.panel-foot button{background:none;border:0;font-family:var(--f);font-size:12px;font-weight:700;color:var(--brand-str);cursor:pointer;padding:4px 6px}
.panel-foot button.mut{color:var(--muted)}
.scount{margin-left:auto;font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.scount b{color:var(--ink);font-weight:700;font-family:var(--fm);font-size:12px}
.reset{background:none;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-family:var(--f);font-size:12px;
  font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s}
.reset:hover{border-color:var(--brand);color:var(--brand-str)}
/* live-sync status pill */
.live{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;
  font-family:var(--fm);font-size:11px;font-weight:500;color:var(--ink-2);cursor:pointer;background:var(--card);
  transition:.15s;white-space:nowrap;user-select:none}
.live:hover{border-color:var(--brand)}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.live[data-state="live"]{border-color:var(--brand);color:var(--brand-str)}
.live[data-state="live"] .dot{background:var(--brand)}
.live[data-state="syncing"] .dot,.live[data-state="deferred"] .dot{background:var(--brand);animation:pulse 1.1s ease-in-out infinite}
.live[data-state="stale"] .dot,.live[data-state="snapshot"] .dot{background:var(--pu)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none!important}}
.themebtn{background:none;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;cursor:pointer;color:var(--ink-2);
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s}
.themebtn:hover{border-color:var(--brand);color:var(--brand-str)}

/* ---------------- cohort builder ---------------- */
.cg-wrap{display:flex;flex-direction:column;gap:0}
.cg{border:1px solid var(--line);border-radius:12px;padding:13px 13px 5px;position:relative;background:var(--card-2)}
.cg-or{align-self:center;font-family:var(--fm);font-size:10px;font-weight:600;color:var(--brand-str);background:var(--brand-soft);
  padding:3px 12px;border-radius:20px;margin:9px 0;letter-spacing:.8px}
.cg-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cg-head .allof{color:var(--brand-str);background:var(--brand-soft);padding:2px 8px;border-radius:20px}
.cg-del{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
.cg-del:hover{border-color:var(--brand);color:var(--brand-str)}
.cond{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.cond .andchip{font-family:var(--fm);font-size:9.5px;font-weight:600;color:var(--muted);width:32px;flex:none;text-align:center;letter-spacing:.5px}
.cond select,.cond input{font-family:var(--f);font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;background:var(--card);color:var(--ink);outline:none;transition:.15s}
.cond select:focus,.cond input:focus{border-color:var(--brand)}
.cond .c-field{min-width:186px}
.cond .c-op{min-width:70px}
.cond input.c-val{width:96px;font-family:var(--fm)}
.cond select.c-val{min-width:150px}
.mschips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:180px}
.mschip{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:20px;padding:5px 10px;background:var(--card);
  color:var(--ink-2);cursor:pointer;transition:.12s;white-space:nowrap;font-family:var(--f)}
.mschip:hover{border-color:var(--muted)}
.mschip.on{background:var(--brand);border-color:var(--brand);color:var(--card)}
.cond .c-del{margin-left:auto;width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);cursor:pointer;font-size:15px;line-height:1;flex:none;transition:.15s}
.cond .c-del:hover{border-color:var(--brand);color:var(--brand-str)}
.cg-add{background:none;border:0;color:var(--brand-str);font-family:var(--f);font-size:12px;font-weight:700;cursor:pointer;padding:4px 0 8px;margin-left:40px}
.btn-add-group,.btn-clear-cohort{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 13px;
  font-family:var(--f);font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
.btn-add-group:hover{border-color:var(--brand);color:var(--brand-str)}
.cohort-empty{padding:6px 2px}
.cohort-empty p{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:12px}

/* ---------------- layout ---------------- */
main{max-width:1440px;margin:0 auto;padding:22px 28px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.k-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);line-height:1.35;min-height:28px}
.k-val{font-family:var(--fm);font-size:29px;font-weight:600;letter-spacing:-1.2px;line-height:1;margin-top:7px;color:var(--ink)}
.k-val .u{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:1px}
.k-sub{font-size:11px;color:var(--ink-2);margin-top:7px;font-weight:500;line-height:1.4}
.k-sub .num{font-size:10.5px}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:17px 19px 19px;min-width:0}
.card.c4{grid-column:span 4}.card.c5{grid-column:span 5}.card.c6{grid-column:span 6}
.card.c7{grid-column:span 7}.card.c8{grid-column:span 8}.card.c12{grid-column:span 12}
.card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:13px}
.card-t{font-size:14px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:7px;text-wrap:balance}
.card-d{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:500;line-height:1.45}
.tag{margin-left:auto;flex:none;font-family:var(--fm);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  background:var(--brand-soft);color:var(--brand-str);padding:4px 9px;border-radius:20px;white-space:nowrap}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:12.5px;font-weight:500}

/* info popover */
.info{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-size:9.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;cursor:help;position:relative;flex:none;font-family:var(--fm)}
.info:hover,.info:focus{border-color:var(--brand);color:var(--brand-str)}
/* display:none while closed keeps this absolutely-positioned panel out of the
   document's scrollable overflow, which otherwise widens the page on mobile */
.info-pop{display:none;position:absolute;top:calc(100% + 9px);left:-10px;width:min(330px,calc(100vw - 36px));
  background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lift);padding:13px 14px;
  pointer-events:none;z-index:80;text-align:left;font-family:var(--f);font-weight:400;color:var(--ink)}
.info:hover .info-pop,.info:focus .info-pop{display:block;pointer-events:auto}
.info-pop .hd{font-size:12px;font-weight:700;margin-bottom:7px}
.info-pop .tx{font-size:11.5px;color:var(--ink-2);line-height:1.55}
.info-pop .row{display:flex;gap:9px;align-items:flex-start;margin-top:7px}
.info-pop .p{font-family:var(--fm);font-size:9.5px;font-weight:600;border-radius:5px;padding:2px 6px;flex:none;min-width:26px;text-align:center}
.p.pP0{background:var(--p0);color:var(--p0-ink)}
.p.pP1{background:var(--p1);color:var(--p1-ink)}
.p.pP2{background:var(--p2);color:var(--p2-ink)}
.p.pP3{background:var(--p3);color:var(--p3-ink)}
.p.pU {background:var(--pu);color:var(--pu-ink)}

/* svg text classes */
.barlabel{font-family:var(--f);font-size:12px;font-weight:600;fill:var(--ink-2)}
.barval{font-family:var(--fm);font-size:11px;font-weight:500;fill:var(--ink-2)}
.axis{font-family:var(--fm);font-size:10px;font-weight:500;fill:var(--muted)}
.axis-nm{font-family:var(--f);font-size:11px;font-weight:600;fill:var(--muted)}
.bar-track{fill:var(--track)}
.gridline{stroke:var(--line);stroke-width:1}
.rowhit{cursor:default}
.rowhit:hover .bseg{filter:brightness(1.06)}
.donut-v{font-family:var(--fm);font-size:26px;font-weight:600;fill:var(--ink);letter-spacing:-1px}
.donut-l{font-family:var(--f);font-size:10.5px;font-weight:700;fill:var(--muted);text-transform:uppercase;letter-spacing:.7px}

/* meter rows */
.mtr{display:flex;flex-direction:column;gap:3px}
.mtr-glbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  margin:13px 0 7px;display:flex;align-items:center;gap:9px}
.mtr-glbl:first-child{margin-top:0}
.mtr-glbl .win-sel{font-family:var(--fm);font-size:10px;font-weight:600;border:1px solid var(--line);border-radius:6px;
  padding:2px 5px;background:var(--card);color:var(--ink-2);cursor:pointer;letter-spacing:0}
.mtr-row{padding:6px 0}
.mtr-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
.mtr-lbl{font-size:12.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.mtr-val{font-family:var(--fm);font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.3px;white-space:nowrap}
.mtr-bar{height:8px;border-radius:5px;background:var(--track);overflow:hidden}
.mtr-bar i{display:block;height:100%;border-radius:5px;background:var(--brand);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mtr-sub{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:500}
.mtr-sub .num{font-size:10px}
.intent-wrap{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px}
.intent-input{width:46px;font-family:var(--fm);font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:6px;
  padding:3px 5px;background:var(--card);color:var(--ink);outline:none;text-align:center}
.intent-input:focus{border-color:var(--brand)}
.stepper{display:flex;flex-direction:column;gap:1px}
.stepper button{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:6px;line-height:1;
  padding:2px 4px;cursor:pointer;border-radius:3px}
.stepper button:hover{border-color:var(--brand);color:var(--brand-str)}

/* coverage rings */
.cov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cov-tile{border:1px solid var(--line);border-radius:12px;padding:16px 12px 15px;text-align:center;background:var(--card-2)}
.cov-rings{display:flex;justify-content:center;gap:8px;margin-bottom:11px}
.cov-lbl{font-size:12.5px;font-weight:700;color:var(--ink)}
.cov-sub{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:500;line-height:1.45}
.cov-sub .num{font-size:10px}

/* priority card: chart beside the always-visible tier definitions */
.pri-split{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:22px;align-items:start}
@media(max-width:900px){.pri-split{grid-template-columns:1fr}}
.tiers{display:flex;flex-direction:column;gap:2px;margin:0}
.tier-row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;
  padding:9px 0;border-bottom:1px solid var(--line-2)}
.tier-row:last-child{border-bottom:0}
.tier-row dt{margin:0;padding-top:1px}
.tier-row dd{margin:0;min-width:0}
.tier-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tier-n{font-size:12.5px;font-weight:700;color:var(--ink)}
.tier-v{font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tier-r{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:3px}
.tier-r b{color:var(--ink-2);font-weight:700}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
table.tbl th{text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  padding:10px 12px;background:var(--card-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.tbl th.r,table.tbl td.r{text-align:right}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--card-2)}
table.tbl td.nm{font-weight:600;color:var(--ink);max-width:250px}
table.tbl td.nm a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
table.tbl td.nm a:hover{color:var(--brand-str);border-bottom-color:var(--brand)}
table.tbl td.dim{color:var(--ink-2);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tbl td.num,table.tbl th.num{font-family:var(--fm);font-variant-numeric:tabular-nums;font-size:11.5px}
table.tbl td .down{color:var(--brand-str);font-weight:700}
.pill{display:inline-block;font-family:var(--fm);font-size:9.5px;font-weight:600;border-radius:5px;padding:2px 7px}
.pill.P0{background:var(--p0);color:var(--p0-ink)}
.pill.P1{background:var(--p1);color:var(--p1-ink)}
.pill.P2{background:var(--p2);color:var(--p2-ink)}
.pill.P3{background:var(--p3);color:var(--p3-ink)}
.pill.Unranked{background:var(--pu);color:var(--pu-ink)}
.pill.Notinportfolio{background:var(--pn);color:var(--pn-ink)}
body[data-mode="contacts"] .pill.P0{background:var(--t0);color:var(--t0-ink)}
body[data-mode="contacts"] .pill.P1{background:var(--t1);color:var(--t1-ink)}
body[data-mode="contacts"] .pill.P2{background:var(--t2);color:var(--t2-ink)}
body[data-mode="contacts"] .pill.P3{background:var(--t3);color:var(--t3-ink)}
.sigstrip{display:inline-flex;gap:2px;vertical-align:middle}
.sigstrip i{width:9px;height:15px;border-radius:2px;background:var(--track);display:block;cursor:help;transition:.12s}
.sigstrip i:hover{outline:2px solid var(--brand);outline-offset:1px}
.sigstrip i.on{background:var(--brand)}

/* tooltip */
#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--mast);color:var(--mast-ink);
  border-radius:9px;padding:9px 12px;font-size:11.5px;line-height:1.5;box-shadow:0 8px 26px rgba(0,0,0,.3);z-index:200;max-width:280px}
#tip .tt-t{font-weight:700;font-size:12px;margin-bottom:3px}
#tip .tt-r{color:var(--mast-mut)}
#tip .tt-r b{color:var(--mast-ink);font-family:var(--fm);font-weight:600}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 15px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2)}
.legend .li{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .lv{font-family:var(--fm);font-size:10.5px;font-weight:500;color:var(--muted)}

footer{max-width:1440px;margin:20px auto 0;padding:0 28px;color:var(--muted);font-size:11px;display:flex;
  justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:500}
footer a{color:var(--ink-2)}

@media(max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .card.c4,.card.c5,.card.c6,.card.c7,.card.c8{grid-column:span 12}
  .cov-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .top-inner{padding:14px 16px}.filters-inner,main,footer{padding-left:16px;padding-right:16px}
  .modes{margin-left:0;width:100%}.modes button{flex:1;justify-content:center}
  .filters{top:112px}
  .cov-grid{grid-template-columns:1fr}
  .cond .c-field{min-width:140px}
  /* narrow screens: show the explainer as a bottom sheet so it always fits */
  .info-pop{position:fixed;left:12px;right:12px;top:auto;bottom:12px;width:auto}
}

:root[data-theme="dark"]{--brand:#7fb89c;--brand-str:#a5d0b8;--brand-lite:#7fb89c;--brand-soft:#14291e;--accent:#9c90e0;--accent-str:#b9b1ea;--accent-lite:#9c90e0;--accent-soft:#221c49;--p0:#cfe6d8;--p1:#8fc4a6;--p2:#2f7050;--p3:#26593f;--pu:#5c6472;--pn:#3b424e;--p0-ink:#0c1f15;--p1-ink:#0c1f15;--p2-ink:#ffffff;--p3-ink:#ffffff;--pu-ink:#eef2f8;--pn-ink:#eef2f8;--t0:#d4cdf2;--t1:#a89ce5;--t2:#6553cc;--t3:#4f3fae;--t0-ink:#191338;--t1-ink:#191338;--t2-ink:#ffffff;--t3-ink:#ffffff;--s0:#ded9f5;--s1:#beb5ec;--s2:#9c90e0;--s3:#7b6bd8;--s4:#5a49c0;--s5:#43389b;--s0-ink:#191338;--s1-ink:#191338;--s2-ink:#191338;--s3-ink:#ffffff;--s4-ink:#ffffff;--s5-ink:#ffffff;--ink:#eef2f8;--ink-2:#a9b3c2;--muted:#818c9c;--line:#282e38;--line-2:#1d222a;--track:#232932;--bg:#0d1117;--card:#161b22;--card-2:#1c222b;--mast:#121117;--mast-2:#26252d;--mast-3:#35343d;--mast-ink:#f2f2f7;--mast-mut:#a2a0ab;--ok:#7fb89c;--warn:#d4a017;}

<script>
/* Sprouts host: post live portfolio stats to the embedding app */
(function(){
  if (window.parent === window) return;
  var last = '';
  function post(){
    try{
      var acc = (typeof ACC !== 'undefined' && ACC) || [];
      if (!acc.length) return;
      var dict = (typeof DATA !== 'undefined' && DATA && DATA.dict && DATA.dict.pri) || [];
      var mix = {};
      for (var i = 0; i < acc.length; i++){
        var v = acc[i].pri, t = (dict[v] !== undefined) ? dict[v] : v;
        if (t == null || t === '') t = 'Unranked';
        mix[t] = (mix[t] || 0) + 1;
      }
      var con = (typeof CON !== 'undefined' && CON) ? CON.length : 0;
      var cov = (typeof DATA !== 'undefined' && DATA && DATA.summary && DATA.summary.contCov) || null;
      var msg = { type: 'sprouts-partner-stats', partner: 'sh', accounts: acc.length, contacts: con, tiers: mix, contCov: cov, at: Date.now() };
      var key = JSON.stringify([msg.accounts, msg.contacts, msg.tiers, cov && cov.email]);
      if (key === last) return;
      last = key;
      window.parent.postMessage(msg, '*');
    }catch(e){}
  }
  setInterval(post, 3000); setTimeout(post, 1200);
})();
</script>
