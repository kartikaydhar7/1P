<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JK Technology Account Intelligence</title>
<meta name="description" content="Signal enrichment across JK Technology's Singapore SMB portfolio: account prioritisation, workplace-refresh signals and target-contact coverage.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<script>(function(){var q=new URLSearchParams(location.search);if(q.has('embed'))document.documentElement.setAttribute('data-embed','1');var t=q.get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="icon" href="jk-mark.png" type="image/png">
<link rel="apple-touch-icon" href="jk-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ================================================================
   JK Technology Account Intelligence — design tokens
   JK's logo green anchors the accounts board; the magenta from the
   jktech.com.sg storefront carries the contacts board. Every ordinal
   ramp below was validated for lightness monotonicity, adjacent dL
   and light-end contrast against its own surface, in both themes.
   ================================================================ */
:root{
  color-scheme:light;
  /* brand */
  --brand:#00874A; --brand-str:#06643A; --brand-lite:#00A04E; --brand-soft:#E4F5EB;
  --accent:#B5124A; --accent-str:#8E1042; --accent-lite:#D44A79; --accent-soft:#FCE7EE;
  /* the filled tab pill, which sits on the dark masthead and must carry its own ink */
  --pill:#00874A; --pill-ink:#FFFFFF; --pill-c:#B5124A; --pill-c-ink:#FFFFFF;
  --wordmark-c:#EE7CA1;
  /* priority ordinal ramp (P0 strongest -> P3), unranked neutral */
  --p0:#04381F; --p1:#075C33; --p2:#077B42; --p3:#45B27C; --pu:#A8B0AA; --pn:#C7CDC8;
  --p0-ink:#FFFFFF; --p1-ink:#FFFFFF; --p2-ink:#FFFFFF; --p3-ink:#06180F; --pu-ink:#0F1512; --pn-ink:#0F1512;
  /* account-tier ordinal ramp, JK magenta (contacts board) */
  --t0:#5E0A2C; --t1:#8E1042; --t2:#B5124A; --t3:#D44A79;
  --t0-ink:#FFFFFF; --t1-ink:#FFFFFF; --t2-ink:#FFFFFF; --t3-ink:#FFFFFF;
  /* seniority ordinal ramp (most senior strongest -> IC) */
  --s0:#4E0724; --s1:#750C36; --s2:#9E104A; --s3:#C4295F; --s4:#DA5C88; --s5:#EC93B1;
  /* neutrals, biased a few degrees toward the brand hue */
  --ink:#141916; --ink-2:#47504B; --muted:#69736D;
  --line:#E2E8E4; --line-2:#EEF2EF; --track:#E8EDEA;
  --bg:#F2F5F3; --card:#FFFFFF; --card-2:#FAFCFB;
  --mast:#101512; --mast-2:#1E2620; --mast-3:#2B342D; --mast-ink:#F2F5F3; --mast-mut:#93A099;
  --shadow:0 1px 2px rgba(10,26,18,.04),0 6px 20px rgba(10,26,18,.06);
  --shadow-lift:0 1px 2px rgba(10,26,18,.05),0 10px 30px rgba(10,26,18,.10);
  --f:'Figtree','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  --fm:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --brand:#3DC97E; --brand-str:#6FDDA0; --brand-lite:#3DC97E; --brand-soft:#0C2E1D;
    --accent:#EE6B96; --accent-str:#F49AB8; --accent-lite:#F49AB8; --accent-soft:#3A1122;
    --pill:#3DC97E; --pill-ink:#062514; --pill-c:#EE6B96; --pill-c-ink:#2A0616;
    --wordmark-c:#F49AB8;
    --p0:#A5EDC4; --p1:#58D18C; --p2:#12834A; --p3:#0C5C34; --pu:#5C635E; --pn:#3D423E;
    --p0-ink:#052014; --p1-ink:#052014; --p2-ink:#FFFFFF; --p3-ink:#FFFFFF; --pu-ink:#EDF2EF; --pn-ink:#EDF2EF;
    --t0:#F2A8C2; --t1:#E87BA1; --t2:#C24371; --t3:#9C2E58;
    --t0-ink:#2A0616; --t1-ink:#2A0616; --t2-ink:#FFFFFF; --t3-ink:#FFFFFF;
    --s0:#F6BDD1; --s1:#EE96B4; --s2:#E06E96; --s3:#CC4B79; --s4:#AC3560; --s5:#8A2649;
    --ink:#EDF2EF; --ink-2:#A9B4AE; --muted:#82908A;
    --line:#29302C; --line-2:#1E241F; --track:#242B27;
    --bg:#0F1210; --card:#181C19; --card-2:#1E231F;
    --mast:#070907; --mast-2:#1C221E; --mast-3:#29312B; --mast-ink:#EDF2EF; --mast-mut:#7F8C85;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.34);
    --shadow-lift:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.44);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand:#3DC97E; --brand-str:#6FDDA0; --brand-lite:#3DC97E; --brand-soft:#0C2E1D;
  --accent:#EE6B96; --accent-str:#F49AB8; --accent-lite:#F49AB8; --accent-soft:#3A1122;
  --pill:#3DC97E; --pill-ink:#062514; --pill-c:#EE6B96; --pill-c-ink:#2A0616;
  --wordmark-c:#F49AB8;
  --p0:#A5EDC4; --p1:#58D18C; --p2:#12834A; --p3:#0C5C34; --pu:#5C635E; --pn:#3D423E;
  --p0-ink:#052014; --p1-ink:#052014; --p2-ink:#FFFFFF; --p3-ink:#FFFFFF; --pu-ink:#EDF2EF; --pn-ink:#EDF2EF;
  --t0:#F2A8C2; --t1:#E87BA1; --t2:#C24371; --t3:#9C2E58;
  --t0-ink:#2A0616; --t1-ink:#2A0616; --t2-ink:#FFFFFF; --t3-ink:#FFFFFF;
  --s0:#F6BDD1; --s1:#EE96B4; --s2:#E06E96; --s3:#CC4B79; --s4:#AC3560; --s5:#8A2649;
  --ink:#EDF2EF; --ink-2:#A9B4AE; --muted:#82908A;
  --line:#29302C; --line-2:#1E241F; --track:#242B27;
  --bg:#0F1210; --card:#181C19; --card-2:#1E231F;
  --mast:#070907; --mast-2:#1C221E; --mast-3:#29312B; --mast-ink:#EDF2EF; --mast-mut:#7F8C85;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.34);
  --shadow-lift:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.44);
}
/* contacts mode retints the interactive chrome to the magenta accent */
body[data-mode="contacts"]{--brand:var(--accent);--brand-str:var(--accent-str);--brand-lite:var(--accent-lite);--brand-soft:var(--accent-soft)}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;
     -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-bottom:56px}
::selection{background:var(--brand);color:var(--bg)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------------- masthead ---------------- */
header.top{background:var(--mast);color:var(--mast-ink);position:sticky;top:0;z-index:60}
.top-inner{max-width:1440px;margin:0 auto;padding:15px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:36px;width:auto;flex:none;display:block}
@media(max-width:700px){.logo{height:30px}}
.wordmark{font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--mast-mut);line-height:1;margin-bottom:5px}
.wordmark b{color:var(--brand-lite);font-weight:800}
body[data-mode="contacts"] .wordmark b{color:var(--wordmark-c)}
.htitle{font-size:15.5px;font-weight:700;letter-spacing:-.1px;line-height:1.2}
.hsub{font-size:11.5px;color:var(--mast-mut);margin-top:3px;letter-spacing:.2px;font-weight:500}
.modes{margin-left:auto;display:flex;background:var(--mast-2);border-radius:11px;padding:4px;gap:3px}
.modes button{border:0;background:transparent;color:var(--mast-mut);font-family:var(--f);font-weight:600;font-size:13px;
  padding:9px 20px;border-radius:8px;cursor:pointer;transition:.18s;white-space:nowrap;display:flex;align-items:center;gap:8px}
.modes button:hover{color:var(--mast-ink);background:var(--mast-3)}
.modes button .n{font-family:var(--fm);font-size:10.5px;font-weight:600;opacity:.66}
.modes button.active{background:var(--pill);color:var(--pill-ink)}
.modes button.active .n{opacity:.8}
body[data-mode="contacts"] .modes button.active{background:var(--pill-c);color:var(--pill-c-ink)}

/* ---------------- filter rail ---------------- */
.filters{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--mastH,78px);z-index:55}
.filters-inner{max-width:1440px;margin:0 auto;padding:13px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fgroup{position:relative}
.fbtn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;font-family:var(--f);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
.fbtn:hover{border-color:var(--muted);background:var(--card-2)}
.fbtn.has{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-str)}
.fbtn .lbl{color:var(--muted);font-weight:500}
.fbtn.has .lbl{color:var(--brand-str)}
.fbtn .cnt{background:var(--brand);color:var(--card);border-radius:20px;font-family:var(--fm);font-size:10px;font-weight:600;padding:2px 7px;min-width:18px;text-align:center}
.caret{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.5}
.fbtn.adv .advic{color:var(--brand);font-size:13px;line-height:1}
.panel{position:absolute;top:calc(100% + 8px);left:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lift);width:330px;max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:.16s;z-index:70}
.panel.open{max-height:460px;opacity:1;pointer-events:auto}
.panel.adv{width:min(680px,92vw)}
.panel.adv.open{max-height:620px}
.adv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.adv-head .t{font-size:13px;font-weight:700}
.adv-head .t .d{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px;line-height:1.45}
.adv-head .m{text-align:right;white-space:nowrap}
.adv-head .m .v{font-family:var(--fm);font-size:18px;font-weight:600;letter-spacing:-.4px;line-height:1.1}
.adv-head .m .l{font-size:9.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.adv-body{max-height:430px;overflow-y:auto;padding:14px 16px}
.adv-foot{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line-2)}
.panel-search{padding:11px 12px;border-bottom:1px solid var(--line-2)}
.panel-search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:var(--f);
  font-size:12.5px;outline:none;background:var(--card-2);color:var(--ink)}
.panel-search input:focus{border-color:var(--brand)}
.opts{max-height:310px;overflow-y:auto;padding:6px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;transition:.1s}
.opt:hover{background:var(--line-2)}
.opt .box{width:16px;height:16px;border:2px solid var(--muted);border-radius:5px;flex:none;position:relative;transition:.12s}
.opt.on .box{background:var(--brand);border-color:var(--brand)}
.opt.on .box:after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border-right:2px solid var(--card);border-bottom:2px solid var(--card);transform:rotate(45deg)}
.opt .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.ph .nm{color:var(--muted);font-style:italic}
.opt .qty{color:var(--muted);font-family:var(--fm);font-size:10.5px;font-weight:500}
.panel-foot{display:flex;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line-2)}
.panel-foot button{background:none;border:0;font-family:var(--f);font-size:12px;font-weight:700;color:var(--brand-str);cursor:pointer;padding:4px 6px}
.panel-foot button.mut{color:var(--muted)}
.scount{margin-left:auto;font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.scount b{color:var(--ink);font-weight:700;font-family:var(--fm);font-size:12px}
.reset{background:none;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-family:var(--f);font-size:12px;
  font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s}
.reset:hover{border-color:var(--brand);color:var(--brand-str)}
/* live-sync status pill */
.live{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;
  font-family:var(--fm);font-size:11px;font-weight:500;color:var(--ink-2);cursor:pointer;background:var(--card);
  transition:.15s;white-space:nowrap;user-select:none}
.live:hover{border-color:var(--brand)}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.live[data-state="live"]{border-color:var(--brand);color:var(--brand-str)}
.live[data-state="live"] .dot{background:var(--brand)}
.live[data-state="syncing"] .dot,.live[data-state="deferred"] .dot{background:var(--brand);animation:pulse 1.1s ease-in-out infinite}
.live[data-state="stale"] .dot,.live[data-state="snapshot"] .dot{background:var(--pu)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none!important}}
.themebtn{background:none;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;cursor:pointer;color:var(--ink-2);
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s}
.themebtn:hover{border-color:var(--brand);color:var(--brand-str)}

/* ---------------- cohort builder ---------------- */
.cg-wrap{display:flex;flex-direction:column;gap:0}
.cg{border:1px solid var(--line);border-radius:12px;padding:13px 13px 5px;position:relative;background:var(--card-2)}
.cg-or{align-self:center;font-family:var(--fm);font-size:10px;font-weight:600;color:var(--brand-str);background:var(--brand-soft);
  padding:3px 12px;border-radius:20px;margin:9px 0;letter-spacing:.8px}
.cg-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cg-head .allof{color:var(--brand-str);background:var(--brand-soft);padding:2px 8px;border-radius:20px}
.cg-del{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
.cg-del:hover{border-color:var(--brand);color:var(--brand-str)}
.cond{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.cond .andchip{font-family:var(--fm);font-size:9.5px;font-weight:600;color:var(--muted);width:32px;flex:none;text-align:center;letter-spacing:.5px}
.cond select,.cond input{font-family:var(--f);font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;background:var(--card);color:var(--ink);outline:none;transition:.15s}
.cond select:focus,.cond input:focus{border-color:var(--brand)}
.cond .c-field{min-width:200px}
.cond .c-op{min-width:70px}
.cond input.c-val{width:96px;font-family:var(--fm)}
.cond select.c-val{min-width:150px}
.mschips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:180px}
.mschip{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:20px;padding:5px 10px;background:var(--card);
  color:var(--ink-2);cursor:pointer;transition:.12s;white-space:nowrap;font-family:var(--f)}
.mschip:hover{border-color:var(--muted)}
.mschip.on{background:var(--brand);border-color:var(--brand);color:var(--card)}
.cond .c-del{margin-left:auto;width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);cursor:pointer;font-size:15px;line-height:1;flex:none;transition:.15s}
.cond .c-del:hover{border-color:var(--brand);color:var(--brand-str)}
.cg-add{background:none;border:0;color:var(--brand-str);font-family:var(--f);font-size:12px;font-weight:700;cursor:pointer;padding:4px 0 8px;margin-left:40px}
.btn-add-group,.btn-clear-cohort{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 13px;
  font-family:var(--f);font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
.btn-add-group:hover{border-color:var(--brand);color:var(--brand-str)}
.cohort-empty{padding:6px 2px}
.cohort-empty p{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:12px}

/* ---------------- layout ---------------- */
main{max-width:1440px;margin:0 auto;padding:22px 28px}
/* ---------------- boot state ----------------
   The page ships with no embedded data, so the first paint is this panel while
   the sheet is being read. Everything below it renders only once data lands. */
.boot{grid-column:span 12;display:flex;align-items:center;justify-content:center;min-height:min(58vh,440px)}
.boot-in{display:flex;align-items:center;gap:16px;max-width:520px;padding:0 20px}
.boot-t{font-size:15px;font-weight:700;letter-spacing:-.1px}
.boot-d{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.boot-spin{width:24px;height:24px;border-radius:50%;flex:none;
  border:2.5px solid var(--track);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot.failed .boot-spin{border-top-color:var(--pu);animation:none}
@media (prefers-reduced-motion:reduce){.boot-spin{animation:none}}
/* while booting the rail has nothing to filter, so it is inert rather than misleading */
body.booting .fbtn,body.booting .reset{opacity:.45;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.k-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);line-height:1.35;min-height:28px}
.k-val{font-family:var(--fm);font-size:29px;font-weight:600;letter-spacing:-1.2px;line-height:1;margin-top:7px;color:var(--ink)}
.k-val .u{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:1px}
.k-sub{font-size:11px;color:var(--ink-2);margin-top:7px;font-weight:500;line-height:1.4}
.k-sub .num{font-size:10.5px}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:17px 19px 19px;min-width:0}
.card.c4{grid-column:span 4}.card.c5{grid-column:span 5}.card.c6{grid-column:span 6}
.card.c7{grid-column:span 7}.card.c8{grid-column:span 8}.card.c12{grid-column:span 12}
.card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:13px}
.card-t{font-size:14px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:7px;text-wrap:balance}
.card-d{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:500;line-height:1.45}
.tag{margin-left:auto;flex:none;font-family:var(--fm);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  background:var(--brand-soft);color:var(--brand-str);padding:4px 9px;border-radius:20px;white-space:nowrap}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:12.5px;font-weight:500}

/* info popover */
.info{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-size:9.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;cursor:help;position:relative;flex:none;font-family:var(--fm)}

<script>
const SNAPSHOT =
null;
const SNAPSHOT_AT = null;
/* ============================================================
   Live data layer.

   The dashboard ships with an embedded snapshot so it paints
   instantly, then re-derives the same structure in the browser
   from the Google Sheet's CSV export. buildData() below is a
   direct port of build_data.py — the two must agree exactly.
   ============================================================ */
/* ---------------- data source ----------------
   In production the page talks to /api/sheet, a serverless proxy that holds the
   spreadsheet id in SHEET_ID and caches at the edge — so the id never reaches
   the browser and N viewers cost one upstream read per minute instead of N.

   Passing ?sheet=<spreadsheetId> bypasses the proxy and reads Google directly,
   which is how the file works when opened from disk or served statically.     */
const TAB_GID = { accounts: '0', contacts: '1985407708' };
const Q = new URLSearchParams(typeof location !== 'undefined' ? location.search : '');
const DIRECT_SHEET = Q.get('sheet');
const REFRESH_MS = (() => {
  const s = parseInt(Q.get('refresh') || '', 10);
  return Number.isFinite(s) ? Math.min(Math.max(s, 15), 3600) * 1000 : 60000;
})();
const sourceUrl = tab => DIRECT_SHEET
  ? `https://docs.google.com/spreadsheets/d/${encodeURIComponent(DIRECT_SHEET)}/export?format=csv&gid=${TAB_GID[tab]}`
  : `/api/sheet?tab=${tab}`;
const DIRECT = !!DIRECT_SHEET;

/* ---------------- CSV ---------------- */
/* RFC4180: quoted fields may contain commas, newlines and doubled quotes.
   The signal narratives contain all three, so this cannot be a split(','). */
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', i = 0, quoted = false;
  const n = text.length;
  while(i < n){
    const c = text[i];
    if(quoted){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        quoted = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if(c === '"'){ quoted = true; i++; continue; }
    if(c === ','){ row.push(field); field = ''; i++; continue; }
    if(c === '\r'){ i++; continue; }
    if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  // drop wholly blank lines, matching the Python loader
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

/* ---------------- field helpers (ported 1:1) ---------------- */
const RX_PLACE = /^(unknown|#ref!?|#n\/?a|n\/?a|na|null|none|nil|tbd|-+|\.+)$/i;
const RX_NEG   = /^\s*[-*\s]*\**\s*(no\b|none\b|not\b|there (are|is) no|no (clear|public|direct|confirmed|specific|evidence|signal|indication))/i;

const L_clean = v => { const t = (v==null?'':String(v)).trim(); return RX_PLACE.test(t) ? '' : t; };
function L_normTxt(v){
  const t = L_clean(v);
  if(!t || t.length < 12) return '';
  return RX_NEG.test(t) ? '' : t;
}
function L_num(v){
  const t = L_clean(v).replace(/,/g,'');
  if(!t) return null;
  const f = Number(t);
  return Number.isFinite(f) ? f : null;
}
const L_title = s => { const t = L_clean(s); return t || 'Unknown'; };

/* The whole portfolio sits in two Employee Count bands, so that column carries
   almost no information. Singapore headcount is what actually sizes a device
   fleet, so the dashboard bands on that instead. */
const SG_BANDS = ['1 - 4','5 - 9','10 - 19','20 - 49','50+'];
function L_sgBand(n){
  if(n == null) return 'Unknown';
  if(n < 5)  return '1 - 4';
  if(n < 10) return '5 - 9';
  if(n < 20) return '10 - 19';
  if(n < 50) return '20 - 49';
  return '50+';
}

/* Ordered by how directly each one predicts a workplace-hardware conversation. */
const L_SIGNALS = [
  ['Singapore Hiring Activity',    'Singapore Workforce Growth'],
  ['Singapore Expansion Activity', 'Singapore Expansion Activity'],
  ['Projects & Initiatives',       'New Singapore Initiatives'],
  ['Digital Transformation',       'Digital Transformation Activity'],
  ['Singapore Expansion Plans',    'Singapore Expansion Plans'],
  ['Funding Activity',             'Singapore Funding Activity'],
  ['Government Funding',           'Singapore Government Funding'],
  ['Office Reopening',             'Singapore Office Reopening'],
  ['Return To Office',             'Singapore Return To Office'],
];
const L_SIG_LABELS = L_SIGNALS.map(s => s[0]);
const L_SIX = {}; L_SIG_LABELS.forEach((l,i) => L_SIX[l] = i);

const L_SEN_MAP = {
  'founder':'Founder / Owner / Partner', 'owner':'Founder / Owner / Partner',
  'partner':'Founder / Owner / Partner',
  'c suite':'C-Suite', 'csuite':'C-Suite', 'c-suite':'C-Suite',
  'vp':'VP / Director / Head', 'director':'VP / Director / Head', 'head':'VP / Director / Head',
  'manager':'Manager', 'senior':'Senior IC', 'entry':'Individual Contributor',
  'intern':'Individual Contributor',
};
const L_SEN_ORDER = ['Founder / Owner / Partner','C-Suite','VP / Director / Head',
                     'Manager','Senior IC','Individual Contributor'];
const L_DECISION = new Set(L_SEN_ORDER.slice(0,3));
const L_seniority = v => L_SEN_MAP[L_clean(v).toLowerCase()] || 'Individual Contributor';

/* The sheet's Department column routes everyone into seven coarse buckets and puts
   a lot of non-technical people under "Information technology". It is kept as the
   client's own segmentation, and this stricter read of the job title runs beside
   it so "who is the actual IT buyer" is answerable. */
const L_ROLE_RULES = [
  ['IT & Technical', /\bit\b|\bi\.t\b|\bict\b|\bmis\b|\binformation technolog|\binfocomm|\b(sysadmin|network|infrastructur|server|desktop|helpdesk|help desk|service desk|technolog|technical|software|developer|programmer|devops|cloud|cyber|security|data|analytics|a\.?i|engineer|architect|systems?)|\b(c\.?t\.?o|c\.?i\.?o|c\.?i\.?s\.?o|c\.?d\.?o)\b|\bchief (information|technolog|digital)/],
  ['Executive & Owner', /\b(founder|owner|proprietor|chairman|chairperson|chief executive|managing director|managing partner|president)\b|\bc\.?e\.?o\b/],
  ['Finance & Procurement', /\b(financ|accounting|accountant|accounts payable|accounts receivable|controller|treasur|procure|purchas|sourcing|audit|taxation|payroll|billing)|\bc\.?f\.?o\b|\bchief financ/],
  ['HR & People', /\bhr\b|\b(human resource|human capital|people|talent|recruit)|\bc\.?h\.?r\.?o\b/],
  ['Operations & Admin', /\b(operat|ops|admin|office manager|facilit|logistic|supply chain|warehouse|production|quality|procurement)\b|\bc\.?o\.?o\b|\bchief operat/],
  ['Sales & Marketing', /\b(sales|marketing|business development|commercial|brand|growth|revenue|account executive|account manager|client servic|public relations)\b|\bc\.?m\.?o\b|\bchief (marketing|revenue|commercial)/],
  ['Executive & Owner', /\b(general manager|country manager|director|executive|partner|principal)\b|\bgm\b/],
];
const L_ROLE_ORDER = ['IT & Technical','Executive & Owner','Operations & Admin',
                      'Finance & Procurement','Sales & Marketing','HR & People','Other'];
function L_role(t){
  const tl = ' ' + t.toLowerCase().replace(/[^a-z&.\s]/g,' ') + ' ';
  for(const [label, pat] of L_ROLE_RULES) if(pat.test(tl)) return label;
  return 'Other';
}
const L_DEPT_MAP = {'information technology':'Information Technology','c suite':'C Suite',
  'c-suite':'C Suite','founder':'Founder','owner':'Owner','operation':'Operations',
  'finance':'Finance','human resource':'Human Resources'};
const L_dept = v => L_DEPT_MAP[L_clean(v).toLowerCase()] || L_title(v);

/* Headcount (nM) columns hold an absolute delta; express it against the base. */
function L_growthPct(now, delta){
  if(now == null || delta == null) return null;
  const base = now - delta;
  if(base <= 0) return null;
  return Math.round(delta / base * 1000) / 10;
}

/* ---------------- the transform ---------------- */
function deriveAccounts(hdr, rowsIn, contactCount, topicCount){
  const ix = name => { const i = hdr.indexOf(name); if(i < 0) throw new Error('missing column: '+name); return i; };
  const a = {};
  ['Company Name','Domain','Company Linkedin Url','Singapore Employee Size','Employee Count',
   'Global Hiring','Singapore Hiring','Intent Score','Intent Topics','industries','Revenue $',
   'Account Country','IT Headcount','IT HC (3M)','IT HC (6M)','IT HC (12M)',
   'Company Headcount','Company Headcount (3M)','Company Headcount (6M)','Company Headcount (12M)']
   .forEach(k => a[k] = ix(k));
  const sigIx = L_SIGNALS.map(([, col]) => ix(col + ' Formatted Response'));

  /* Domains are unique in this sheet but Account Names are not: a few hundred
     rows carry a name that belongs to a different company. Domain is the key;
     the collision is counted so the dashboard can show it rather than hide it. */
  const nameFreq = new Map();
  for(const r of rowsIn){
    const nm = L_clean(r[a['Company Name']]);
    if(nm) nameFreq.set(nm, (nameFreq.get(nm)||0)+1);
  }

  const out = [], meta = new Map();
  for(let r of rowsIn){
    if(r.length < hdr.length) r = r.concat(new Array(hdr.length - r.length).fill(''));
    const name = L_clean(r[a['Company Name']]);
    if(!name) continue;
    const dom = L_clean(r[a['Domain']]).toLowerCase();
    const key = dom || name.toLowerCase();

    const s = sigIx.map(i => L_normTxt(r[i]) ? 1 : 0);
    const nsig = s.reduce((x,y)=>x+y, 0);

    const ints = L_num(r[a['Intent Score']]) || 0;
    const topics = L_clean(r[a['Intent Topics']]).split(',').map(t=>t.trim()).filter(Boolean);
    topics.forEach(t => topicCount.set(t, (topicCount.get(t)||0)+1));

    const sge = L_num(r[a['Singapore Employee Size']]);
    const ghire = Math.trunc(L_num(r[a['Global Hiring']]) || 0);
    const shire = Math.trunc(L_num(r[a['Singapore Hiring']]) || 0);

    const hc  = L_num(r[a['Company Headcount']]);
    const g3  = L_growthPct(hc, L_num(r[a['Company Headcount (3M)']]));
    const g6  = L_growthPct(hc, L_num(r[a['Company Headcount (6M)']]));
    const g12 = L_growthPct(hc, L_num(r[a['Company Headcount (12M)']]));
    const ithc = L_num(r[a['IT Headcount']]);
    const itg3 = L_num(r[a['IT HC (3M)']]), itg6 = L_num(r[a['IT HC (6M)']]), itg12 = L_num(r[a['IT HC (12M)']]);

    const bnd = L_sgBand(sge);
    const ncon = contactCount.get(key) || 0;

    // ---- priority: how close is this account to a workplace-hardware decision
    const procure = ints >= 1 || s[L_SIX['Office Reopening']] || s[L_SIX['Return To Office']];
    const fleet   = s[L_SIX['Singapore Hiring Activity']] || s[L_SIX['Singapore Expansion Activity']]
                    || shire >= 1 || (sge != null && sge >= 10);
    const growing = s[L_SIX['Singapore Hiring Activity']] || shire >= 1 || ghire >= 1
                    || (g12 != null && g12 >= 5) || (itg12 != null && itg12 >= 10);
    const funded  = s[L_SIX['Funding Activity']] || s[L_SIX['Government Funding']]
                    || s[L_SIX['Singapore Expansion Plans']] || (sge != null && sge >= 20);
    const modern  = s[L_SIX['Digital Transformation']] || s[L_SIX['Government Funding']]
                    || s[L_SIX['Projects & Initiatives']];

    let pri;
    if(procure && fleet) pri = 'P0';
    else if(growing && funded) pri = 'P1';
    else if(modern) pri = 'P2';
    else if(nsig >= 1 || (sge != null && sge >= 20)) pri = 'P3';
    else pri = 'Unranked';

    const ind = L_title(r[a['industries']]), loc = L_title(r[a['Account Country']]);
    out.push({ n:name, d:dom, ind, loc, bnd,
      sge: sge==null?null:Math.trunc(sge),
      hc: hc==null?null:Math.trunc(hc), ithc: ithc==null?null:Math.trunc(ithc),
      rev: L_num(r[a['Revenue $']]), g3, g6, g12, itg3, itg6, itg12,
      'is': Math.trunc(ints), nt: topics.length, nc: ncon, pri,
      li: L_clean(r[a['Company Linkedin Url']]) ? 1 : 0,
      gh: ghire, sh: shire, dn: nameFreq.get(name) > 1 ? 1 : 0,
      s, t: topics });
    meta.set(key, { pri, nsig, is: Math.trunc(ints), sge, ind, bnd });
  }
  return { rows: out, meta, given: rowsIn.length };
}

function buildData(accCsv, conCsv){
  const A = parseCSV(accCsv), C = parseCSV(conCsv);
  if(A.length < 2 || C.length < 2) throw new Error('empty sheet export');
  const AH = A[0].map(h => h.trim()), AROWS = A.slice(1);
  const CH = C[0].map(h => h.trim()), CROWS = C.slice(1);

  const ixc = name => { const i = CH.indexOf(name); if(i < 0) throw new Error('missing column: '+name); return i; };
  const c = {};
  ['First Name','Last Name','Contact Linkedin Url','Company Name','Domain',
   'Company Linkedin Url','Title','Department','Seniority','Country']
   .forEach(k => c[k] = ixc(k));

  const ckey = r => (L_clean(r[c['Domain']]).toLowerCase() || L_clean(r[c['Company Name']]).toLowerCase());
  const contactCount = new Map();
  for(const r of CROWS){ const k = ckey(r); if(k) contactCount.set(k, (contactCount.get(k)||0)+1); }

  const topicCount = new Map();
  const acc = deriveAccounts(AH, AROWS, contactCount, topicCount);

  const contacts = [];
  // keyed exactly as the accounts board keys itself, so "accounts covered" on
  // this board and "contacts mapped" on that one are the same number
  const acctIx = new Map(), acctNames = [], acctDoms = [], acctKeys = [];
  const RX_LI = /^(https?:\/\/)?(www\.)?[a-z]{0,3}\.?linkedin\.com\/in\//i;
  for(let r of CROWS){
    if(r.length < CH.length) r = r.concat(new Array(CH.length - r.length).fill(''));
    const key = ckey(r);
    if(!key) continue;
    const jt = L_clean(r[c['Title']]);
    const an = L_clean(r[c['Company Name']]) || key;
    if(!acctIx.has(key)){ acctIx.set(key, acctIx.size); acctNames.push(an); acctKeys.push(key);
                          acctDoms.push(L_clean(r[c['Domain']]).toLowerCase()); }
    const m = acc.meta.get(key);
    const sen = L_seniority(r[c['Seniority']]);
    contacts.push({
      a: acctIx.get(key),
      fn: L_clean(r[c['First Name']]), ln: L_clean(r[c['Last Name']]), jt,
      url: L_clean(r[c['Contact Linkedin Url']]).replace(RX_LI,'').replace(/\/+$/,''),
      ind: m ? m.ind : 'Unknown',
      bnd: m ? m.bnd : 'Unknown',
      sge: m && m.sge != null ? m.sge : null,
      sen, dep: L_dept(r[c['Department']]), rol: jt ? L_role(jt) : 'Other',
      j: m ? 1 : 0,
      pri: m ? m.pri : 'Not in portfolio',
      nsig: m ? m.nsig : 0,
      ais: m ? m.is : 0,
      dm: L_DECISION.has(sen) ? 1 : 0,
    });
  }
  const perAcct = new Map(), dmAcct = new Map(), itAcct = new Map();
  const bump = (m,k) => m.set(k, (m.get(k)||0)+1);
  for(const x of contacts){
    bump(perAcct, x.a);
    if(x.dm) bump(dmAcct, x.a);
    if(x.rol === 'IT & Technical') bump(itAcct, x.a);
  }
  for(const x of contacts){
    x.nca = perAcct.get(x.a);
    x.ndm = dmAcct.get(x.a) || 0;
    x.nit = itAcct.get(x.a) || 0;
  }

  /* ---- compaction: intern the categoricals, emit positional rows ---- */
  const DICTS = {};
  function intern(key, val){
    let d = DICTS[key];
    if(!d){ d = DICTS[key] = {list:[], ix:new Map()}; }
    if(!d.ix.has(val)){ d.ix.set(val, d.list.length); d.list.push(val); }
    return d.ix.get(val);
  }
  const ACOLS = ['n','d','ind','loc','bnd','sge','hc','ithc','rev','g3','g6','g12',
                 'itg3','itg6','itg12','is','nt','nc','pri','li','gh','sh','dn','s','t'];
  const CCOLS = ['a','fn','ln','jt','url','ind','bnd','sge','sen','dep','rol',
                 'j','pri','nsig','ais','nca','ndm','nit','dm'];
  const CATS = {ind:'ind', loc:'loc', bnd:'bnd', pri:'pri', sen:'sen', dep:'dep', rol:'rol'};
  const pack = (rws, spec) => rws.map(r => spec.map(col =>
    CATS[col] ? intern(CATS[col], r[col]) : col==='t' ? r[col].map(t=>intern('topic',t)) : r[col]));

  const cnt = (arr, f) => arr.reduce((s,x)=>s+(f(x)?1:0), 0);
  const arows = acc.rows;
  const acctCov = {
    given: acc.given, rows: arows.length,
    domain: cnt(arows, x=>!!x.d), li: cnt(arows, x=>x.li),
    signal: cnt(arows, x=>x.s.reduce((p,v)=>p+v,0) > 0),
   
    committee: cnt(arows, x=>x.nc > 0),
    sgemp: cnt(arows, x=>x.sge != null),
    firmo: cnt(arows, x=>x.ind !== 'Unknown' && x.loc !== 'Unknown' && x.bnd !== 'Unknown'),
    hc: cnt(arows, x=>x.hc != null), ithc: cnt(arows, x=>x.ithc != null),
    intent: cnt(arows, x=>x['is'] > 0),
    dupname: cnt(arows, x=>x.dn),
  };
  /* Account-level coverage is counted over the accounts portfolio itself rather
     than over the Contacts tab's company list. Two things make that matter here:
     the Contacts tab carries companies the Accounts tab does not (counting those
     puts "accounts covered" over 100%), and a few account rows share a domain,
     so distinct companies and portfolio rows are not the same number. Counting
     rows keeps `covered` identical to "Contacts mapped" on the accounts board. */
  const nKey = new Map(), dmKey = new Map(), itKey = new Map();
  const bumpK = (m,k) => m.set(k, (m.get(k)||0)+1);
  for(const x of contacts){
    const k = acctKeys[x.a];
    bumpK(nKey, k);
    if(x.dm) bumpK(dmKey, k);
    if(x.rol === 'IT & Technical') bumpK(itKey, k);
  }
  const aKey = x => x.d || x.n.toLowerCase();
  const contCov = {
    rows: contacts.length, accts: acctIx.size,
    li: cnt(contacts, x=>!!x.url), joined: cnt(contacts, x=>x.j),
    dm: cnt(contacts, x=>x.dm), it: cnt(contacts, x=>x.rol === 'IT & Technical'),
    covered:    cnt(arows, x=>(nKey.get(aKey(x))||0) > 0),
    acct_dm:    cnt(arows, x=>(dmKey.get(aKey(x))||0) > 0),
    acct_it:    cnt(arows, x=>(itKey.get(aKey(x))||0) > 0),
    acct_multi: cnt(arows, x=>(nKey.get(aKey(x))||0) >= 2),
    acct_both:  cnt(arows, x=>(dmKey.get(aKey(x))||0) > 0 && (itKey.get(aKey(x))||0) > 0),
    portfolio: arows.length,
  };

  const acctRows = pack(arows, ACOLS);
  const contRows = pack(contacts, CCOLS);
  const topN = (m, k) => [...m.entries()].sort((x,y)=> y[1]-x[1] || 0).slice(0, k);
  const dict = {}; for(const k in DICTS) dict[k] = DICTS[k].list;

  return {
    dict,
    accounts: {cols: ACOLS, rows: acctRows, n: acctRows.length},
    contacts: {cols: CCOLS, rows: contRows, n: contRows.length, names: acctNames, doms: acctDoms},
    summary: {
      signals: L_SIG_LABELS, senOrder: L_SEN_ORDER, roleOrder: L_ROLE_ORDER, bands: SG_BANDS,
      topics: topN(topicCount, 20), acctCov, contCov,
    },
  };
}
;

   JK Technology Account Intelligence
   Two datasets from one workbook:
     Accounts  - account-level signal enrichment for the Singapore portfolio
     Contacts  - target contacts, joined back to that portfolio on domain
   ============================================================ */

/* ---------------- dictionaries & hydration ----------------
   These are re-bound whenever a fresh copy of the sheet arrives, so they are
   `let`, not `const`. Everything downstream reads them at render time.        */
let DATA, SIG, SEN_ORDER, ROLE_ORDER, BANDS, ACC, CON, ANAMES, ADOMS, L, RX;

function hydrate(ds){
  const cols = ds.cols;
  return ds.rows.map(r => { const o = {}; for(let i=0;i<cols.length;i++) o[cols[i]] = r[i]; return o; });
}

/* Filter selections are held as dictionary indices, but the dictionaries are
   built in row order — so a sheet edit can shift them. Carry the selections
   across by label and drop anything that no longer exists. */
function remapFilters(oldL){
  MODES.forEach(mode => {
    FILTERS[mode].forEach(({key, dict}) => {
      const set = S[mode][key];
      if(!set || !set.size) return;
      const labels = [...set].map(i => oldL[dict][i]).filter(v => v != null);
      set.clear();
      labels.forEach(lbl => { const i = RX[dict][lbl]; if(i != null) set.add(i); });
    });
  });
}

function adopt(raw){
  const oldL = L;
  DATA = raw;
  SIG = raw.summary.signals;
  SEN_ORDER = raw.summary.senOrder;
  ROLE_ORDER = raw.summary.roleOrder;
  BANDS = raw.summary.bands;
  const d = raw.dict;
  L = { ind:d.ind||[], loc:d.loc||[], bnd:d.bnd||[], pri:d.pri||[],
        sen:d.sen||[], dep:d.dep||[], rol:d.rol||[], topic:d.topic||[] };
  RX = {}; for(const k in L){ RX[k] = {}; L[k].forEach((v,i)=>RX[k][v]=i); }
  ACC = hydrate(raw.accounts);
  CON = hydrate(raw.contacts);
  ANAMES = raw.contacts.names || [];
  ADOMS  = raw.contacts.doms  || [];
  if(oldL) remapFilters(oldL);
}

const PRI_ORDER = ['P0','P1','P2','P3','Unranked'];
const PRI_ORDER_C = ['P0','P1','P2','P3','Unranked','Not in portfolio'];

const FIELDS = () => isAcc() ? ACC_FIELDS : CON_FIELDS;

const NUM_OPS   = {'>':'>','>=':'≥','<':'<','<=':'≤','=':'='};
const MULTI_OPS = {in:'is any of', nin:'is none of', hasany:'has any of', hasall:'has all of', hasnone:'has none of'};
const BOOL_OPS  = {is:'is'};
const BOOL_VALS = [['1','yes'],['0','no']];
const opsFor = t => t==='num' ? NUM_OPS : t==='bool' ? BOOL_OPS : MULTI_OPS;
const isMultiOp = op => ['in','nin','hasany','hasall','hasnone'].includes(op);

function matchCond(x,c){
  const f = FIELDS()[c.field];
  if(!f) return true;
  if(f.type==='multi'){
    const A = asArr(c.val); const on = v => f.test(x,v);
    if(!A.length) return true;
    if(c.op==='in'||c.op==='hasany')  return A.some(on);
    if(c.op==='hasall')               return A.every(on);
    if(c.op==='nin'||c.op==='hasnone')return A.every(v=>!on(v));
    return true;
  }
  if(f.type==='bool') return (f.get(x)?1:0) === (c.val==='1'?1:0);
  const v = f.get(x);
  if(v==null) return false;
  const t = parseFloat(c.val); if(isNaN(t)) return true;
  return c.op==='>'?v>t : c.op==='>='?v>=t : c.op==='<'?v<t : c.op==='<='?v<=t : v===t;
}
const grpActive = g => g.conds.length > 0;
const cohortActive = () => F().cohort.groups.some(grpActive);
const matchCohort = x => F().cohort.groups.some(g => grpActive(g) && g.conds.every(c=>matchCond(x,c)));

function rows(){
  const f = F();
  let a = isAcc() ? ACC : CON;
  FILTERS[S.mode].forEach(({key}) => { const set = f[key]; if(set && set.size) a = a.filter(x=>set.has(x[key])); });
  if(cohortActive()) a = a.filter(matchCohort);
  return a;
}

function tally(a, key){ const m = new Map(); for(const x of a){ m.set(x[key], (m.get(x[key])||0)+1); } return m; }
function byLabel(a, key, dict){
  const m = tally(a,key), out = [];
  for(const [k,v] of m) out.push([L[dict][k], v]);
  return rankSort(out);
}

const tip = $('#tip');
function showTip(e,html){ tip.innerHTML = html; tip.style.opacity = 1; moveTip(e); }
function moveTip(e){
  const r = tip.getBoundingClientRect();
  let x = e.clientX - r.width/2, y = e.clientY - r.height - 14;
  x = Math.max(8, Math.min(x, innerWidth - r.width - 8));
  if(y < 8) y = e.clientY + 18;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
const hideTip = () => { tip.style.opacity = 0; };

/* ---------------- SVG utilities ---------------- */
const NS = 'http://www.w3.org/2000/svg';
function el(t,a){ const e = document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }
function svg(w,h){ return el('svg',{viewBox:`0 0 ${w} ${h}`,preserveAspectRatio:'xMidYMid meet'}); }
function txt(s,a,content){ const t = el('text',a); t.textContent = content; s.appendChild(t); return t; }
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function grow(node, attrs, delay){
  if(REDUCED){ for(const k in attrs) node.setAttribute(k, attrs[k]); return; }
  setTimeout(()=>{ node.style.transition = 'width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1),y .6s cubic-bezier(.2,.8,.2,1),x .6s cubic-bezier(.2,.8,.2,1)';
    for(const k in attrs) node.setAttribute(k, attrs[k]); }, 20 + delay);
}

/* ---------------- chart: donut ---------------- */
function arcPath(cx,cy,rI,rO,a1,a2){
  const p = (r,a)=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
  const [x1,y1]=p(rO,a1),[x2,y2]=p(rO,a2),[x3,y3]=p(rI,a2),[x4,y4]=p(rI,a1);
  const laf = (a2-a1) > Math.PI ? 1 : 0;
  return `M${x1} ${y1}A${rO} ${rO} 0 ${laf} 1 ${x2} ${y2}L${x3} ${y3}A${rI} ${rI} 0 ${laf} 0 ${x4} ${y4}Z`;
}
function donut(box, segs, opts){
  box.innerHTML = '';
  const o = Object.assign({noun:'accounts', center:'Accounts'}, opts||{});
  const tot = segs.reduce((a,b)=>a+b.value,0);
  if(!tot){ emptyBox(box); return; }
  const W = 460, H = 236, cx = 118, cy = 118, rO = 96, rI = 62;
  const s = svg(W,H);
  let ang = -Math.PI/2;
  const gapA = 0.014; // ~2px surface gap between arcs, not a stroke border
  segs.forEach(sg=>{
    if(!sg.value) return;
    const span = sg.value/tot*2*Math.PI;
    const a1 = ang + (span > gapA*2 ? gapA : 0), a2 = ang + span;
    const pe = el('path',{d:arcPath(cx,cy,rI,rO,a1,a2), fill:sg.color, 'class':'rowhit'});
    bindTip(pe, `<div class="tt-t">${esc(sg.label)}</div><div class="tt-r"><b>${fmt(sg.value)}</b> ${o.noun} · <b>${pct(sg.value,tot)}%</b></div>`);
    if(!REDUCED){ pe.style.opacity = 0; setTimeout(()=>{ pe.style.transition='opacity .45s'; pe.style.opacity=1; },40); }
    s.appendChild(pe);
    ang += span;
  });
  txt(s,{x:cx,y:cy-1,'text-anchor':'middle','class':'donut-v'}, fmt(tot));
  txt(s,{x:cx,y:cy+19,'text-anchor':'middle','class':'donut-l'}, o.center);
  let ly = 30;
  const shown = segs.filter(x=>x.value);
  const step = Math.min(34, Math.floor((H-40)/Math.max(shown.length,1)));
  shown.forEach(sg=>{
    s.appendChild(el('rect',{x:250,y:ly-10,width:11,height:11,rx:3,fill:sg.color}));
    txt(s,{x:269,y:ly,'class':'barlabel',style:'font-size:11.5px'}, clip(sg.label,20));
    txt(s,{x:W-4,y:ly,'text-anchor':'end','class':'barval'}, `${fmt(sg.value)} · ${pct(sg.value,tot)}%`);
    ly += step;
  });
  box.appendChild(s);
}

/* ---------------- chart: column histogram ---------------- */
function cols(box, cats, vals, opts){
  box.innerHTML = '';
  /* W tracks the card's real pixel width so the SVG is not scaled up, which
     would magnify every label along with it */
  const o = Object.assign({axisLabel:'', noun:'accounts', greyFirst:false, catFmt:c=>String(c), W:700}, opts||{});
  const tot = vals.reduce((a,b)=>a+b,0);
  if(!tot){ emptyBox(box); return; }
  const W = o.W, H = 246, left = 40, bottom = 42, top = 18, right = 8;
  const s = svg(W,H), plotH = H-top-bottom, bw = (W-left-right)/cats.length;
  const max = Math.max(...vals, 1);
  for(let g=0; g<=4; g++){
    const yy = top + plotH*g/4;
    s.appendChild(el('line',{x1:left,y1:yy,x2:W-right,y2:yy,'class':'gridline'}));
    txt(s,{x:left-6,y:yy+3,'text-anchor':'end','class':'axis'}, fmt(Math.round(max*(1-g/4))));
  }
  cats.forEach((c,i)=>{
    const cx = left + i*bw, v = vals[i], h = plotH*v/max;
    const iw = Math.min(bw*0.62, 46), x = cx + bw/2 - iw/2, y = top + plotH - h;
    const fill = (o.greyFirst && i===0) ? 'var(--pn)' : 'var(--brand)';
    const r = el('rect',{x,y:top+plotH,width:iw,height:0,rx:4,fill:fill,'class':'bseg rowhit'});
    bindTip(r, `<div class="tt-t">${esc(o.catFmt(c))}</div><div class="tt-r"><b>${fmt(v)}</b> ${o.noun} · <b>${pct(v,tot)}%</b></div>`);
    s.appendChild(r);
    if(v>0) txt(s,{x:cx+bw/2,y:y-6,'text-anchor':'middle','class':'barval',style:'font-size:10px'},
                 `${fmt(v)} · ${pct(v,tot)}%`);
    grow(r,{y:y,height:h}, i*22);
    txt(s,{x:cx+bw/2,y:H-bottom+19,'text-anchor':'middle','class':'axis',style:'font-size:11px;fill:var(--ink-2);font-weight:600'}, String(c));
  });
  if(o.axisLabel) txt(s,{x:left+(W-left-right)/2,y:H-5,'text-anchor':'middle','class':'axis-nm'}, o.axisLabel);
  box.appendChild(s);
}

function ringSVG(p, size){
  const r = (size-9)/2, c = 2*Math.PI*r, off = c*(1-Math.min(p,100)/100);
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px" role="img" aria-label="${p}%">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--brand)" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"
      style="transition:stroke-dashoffset .8s ease"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
      style="font-family:var(--fm);font-size:${(size*0.235).toFixed(0)}px;font-weight:600;fill:var(--ink)">${p}%</text></svg>`;
}
/* a ring only reads 100% when the metric is actually complete */
const covPct = (n,d) => (n<d ? Math.min(pct(n,d), 99.9) : pct(n,d));

function kpiSpecs(){

    const sig = a.reduce((s,x)=>s+(x.s.reduce((p,v)=>p+v,0)>0?1:0),0);
    const hiring = a.reduce((s,x)=>s+((x.sh>0 || x.s[0])?1:0),0);
    const fleet = a.reduce((s,x)=>s+((x.sge!=null && x.sge>=10)?1:0),0);
    return [
      {l:'Accounts in view', v:fmt(n), sub:`of <span class="num">${fmt(total())}</span> in the portfolio`},
      {l:'Priority P0 + P1', v:pct(p01,n), u:'%', sub:`<span class="num">${fmt(p01)}</span> hottest accounts`},
      {l:'Carrying a buying signal', v:pct(sig,n), u:'%', sub:`<span class="num">${fmt(sig)}</span> of <span class="num">${fmt(n)}</span> accounts`},
      {l:'Hiring in Singapore', v:pct(hiring,n), u:'%', sub:`<span class="num">${fmt(hiring)}</span> accounts adding local staff`},
      {l:'SG workforce 10+', v:pct(fleet,n), u:'%', sub:`<span class="num">${fmt(fleet)}</span> accounts with a fleet worth refreshing`},
    ];
  }
  const cnt = f => a.reduce((s,x)=>s+(f(x)?1:0),0);

  const it = cnt(x=>L.rol[x.rol]==='IT & Technical');

  const hot = cnt(x=>['P0','P1'].includes(L.pri[x.pri]));

  return [
    {l:'Contacts in view', v:fmt(n), sub:`across <span class="num">${fmt(accts)}</span> accounts`},

  ];

/* ============================================================
   Filters
   ============================================================ */
const fspec = slot => FILTERS[S.mode][slot];
function labelSet(key){
  const spec = FILTERS[S.mode].find(f=>f.key===key);
  if(!spec) return new Set();
  return new Set([...F()[key]].map(i=>L[spec.dict][i]));
}
function optionUniverse(slot){
  const {key, dict} = fspec(slot);
  const src = isAcc() ? ACC : CON;
  const m = tally(src, key), out = [];
  for(const [k,v] of m) out.push([L[dict][k], v, k]);
  if(dict==='bnd'){
    return out.sort((a,b)=>{ const ia=BANDS.indexOf(a[0]), ib=BANDS.indexOf(b[0]);
      return (ia<0?99:ia)-(ib<0?99:ib); });
  }
  return out.sort((a,b)=>{ const pa=isPlace(a[0]), pb=isPlace(b[0]);
    if(pa!==pb) return pa?1:-1; return b[1]-a[1]; });
}
function toggleFilter(key, ix){
  if(ix==null) return;
  const set = F()[key]; if(!set) return;
  set.has(ix) ? set.delete(ix) : set.add(ix);
  renderAll();
}
function buildPanel(slotId, btn){
  const fg = btn.parentElement;
  let panel = fg.querySelector('.panel');
  if(panel){ panel.classList.toggle('open'); closeOthers(panel); return; }
  if(slotId==='adv'){ buildAdvPanel(fg); return; }
  const slot = +slotId.slice(1), spec = fspec(slot);
  panel = document.createElement('div'); panel.className = 'panel open';
  const setRef = F()[spec.key], opts = optionUniverse(slot);
  panel.innerHTML = `<div class="panel-search"><input type="text" placeholder="Search ${esc(spec.plural)}…" aria-label="Search ${esc(spec.plural)}"></div>
    <div class="opts"></div><div class="panel-foot"><button class="mut" data-clr>Clear</button><button data-done>Done</button></div>`;
  const optsBox = panel.querySelector('.opts');
  function paint(q){
    optsBox.innerHTML = '';
    const ql = q.toLowerCase();
    const list = opts.filter(o=>o[0].toLowerCase().includes(ql)).slice(0,300);
    list.forEach(o=>{
      const d = document.createElement('div');
      d.className = 'opt' + (setRef.has(o[2])?' on':'') + (isPlace(o[0])?' ph':'');
      d.innerHTML = `<div class="box"></div><div class="nm" title="${esc(o[0])}">${esc(o[0])}</div><div class="qty">${fmt(o[1])}</div>`;
      d.addEventListener('click', ()=>{ setRef.has(o[2]) ? setRef.delete(o[2]) : setRef.add(o[2]); d.classList.toggle('on'); renderAll(); });
      optsBox.appendChild(d);
    });
    if(!optsBox.children.length) optsBox.innerHTML = '<div class="empty" style="padding:20px">No matches</div>';
  }
  paint('');
  panel.querySelector('input').addEventListener('input', e=>paint(e.target.value));
  panel.querySelector('[data-clr]').addEventListener('click', ()=>{ setRef.clear(); paint(panel.querySelector('input').value); renderAll(); });
  panel.querySelector('[data-done]').addEventListener('click', ()=>panel.classList.remove('open'));
  fg.appendChild(panel); closeOthers(panel);
}
function closeOthers(open){ $$('.panel').forEach(p=>{ if(p!==open) p.classList.remove('open'); }); }
function syncFilterButtons(){
  FILTERS[S.mode].forEach((spec, slot)=>{
    const set = F()[spec.key], btn = document.querySelector(`.fbtn[data-f="f${slot}"]`);
    const t = btn.querySelector('.ftxt');
    btn.querySelector('.lbl').textContent = spec.label + ':';
    if(!set.size){ btn.classList.remove('has'); t.textContent = 'All'; return; }
    btn.classList.add('has');
    const first = L[spec.dict][[...set][0]] || '';
    t.innerHTML = (set.size===1 ? esc(clip(first,16)) : set.size+' selected') + ` <span class="cnt">${set.size}</span>`;
  });
}

  if(!groups.length){
    const e = document.createElement('div'); e.className = 'cohort-empty';
    e.innerHTML = `<p>No conditions yet. Build a segment such as ${isAcc()
      ? '<b>Singapore workforce &ge; 10</b> AND <b>buying signal has any of Singapore Hiring Activity, Office Reopening</b>'
      : '<b>buyer role is any of IT &amp; Technical</b> AND <b>account priority tier is any of P0, P1</b>'}.
      Conditions inside a group are combined with AND; groups are combined with OR.</p>
      <button class="btn-add-group" id="firstGroup">+ Add your first condition</button>`;
    body.appendChild(e);
    $('#firstGroup').addEventListener('click', ()=>{ groups.push({conds:[newCond()]}); renderCohort(); renderAll(); });
    return;
  }
  const wrap = document.createElement('div'); wrap.className = 'cg-wrap';
  groups.forEach((g,gi)=>{
    if(gi>0){ const o = document.createElement('div'); o.className='cg-or'; o.textContent='OR'; wrap.appendChild(o); }
    const box = document.createElement('div'); box.className = 'cg';
    const head = document.createElement('div'); head.className = 'cg-head';
    head.innerHTML = `Group ${gi+1} — match <span class="allof">ALL</span> of:`;
    box.appendChild(head);
    if(groups.length>1){
      const del = document.createElement('button'); del.className='cg-del'; del.innerHTML='&times;'; del.title='Remove group';
      del.addEventListener('click', ()=>{ groups.splice(gi,1); renderCohort(); renderAll(); });
      box.appendChild(del);
    }
    g.conds.forEach((c,ci)=>box.appendChild(condRow(g,c,gi,ci)));
    const add = document.createElement('button'); add.className='cg-add'; add.textContent='+ AND condition';
    add.addEventListener('click', ()=>{ g.conds.push(newCond()); renderCohort(); renderAll(); });
    box.appendChild(add);
    wrap.appendChild(box);
  });
  body.appendChild(wrap);
}
function condRow(g,c,gi,ci){
  const FL = FIELDS();
  const row = document.createElement('div'); row.className = 'cond';
  const and = document.createElement('span'); and.className='andchip'; and.textContent = ci===0?'':'AND'; row.appendChild(and);
  const fsel = document.createElement('select'); fsel.className='c-field'; fsel.setAttribute('aria-label','Field');
  for(const k in FL){ const o=document.createElement('option'); o.value=k; o.textContent=FL[k].label; if(k===c.field)o.selected=true; fsel.appendChild(o); }
  fsel.addEventListener('change', ()=>{ c.field=fsel.value; const d=FL[c.field].def;
    c.op=d.op; c.val=Array.isArray(d.val)?d.val.slice():d.val; renderCohort(); renderAll(); });
  row.appendChild(fsel);
  const type = FL[c.field].type, ops = opsFor(type);
  const osel = document.createElement('select'); osel.className='c-op'; osel.setAttribute('aria-label','Operator');
  for(const k in ops){ const o=document.createElement('option'); o.value=k; o.textContent=ops[k]; if(k===c.op)o.selected=true; osel.appendChild(o); }
  osel.addEventListener('change', ()=>{
    const nowMulti = isMultiOp(osel.value); c.op = osel.value;
    if(nowMulti && !Array.isArray(c.val)) c.val = (c.val===''||c.val==null)?[]:[String(c.val)];
    if(!nowMulti && Array.isArray(c.val)) c.val = c.val.length ? c.val[0] : '';
    renderCohort(); renderAll();
  });
  row.appendChild(osel);
  if(type==='num'){
    const inp=document.createElement('input'); inp.className='c-val num'; inp.type='number'; inp.value=c.val; inp.setAttribute('aria-label','Value');
    inp.addEventListener('change', ()=>{ c.val=inp.value; renderAll(); });
    row.appendChild(inp);
    if(FL[c.field].unit){ const u=document.createElement('span');
      u.style.cssText='font-family:var(--fm);font-size:11.5px;font-weight:600;color:var(--muted)'; u.textContent=FL[c.field].unit; row.appendChild(u); }
  } else if(type==='bool'){
    const vsel=document.createElement('select'); vsel.className='c-val'; vsel.setAttribute('aria-label','Value');
    BOOL_VALS.forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; if(v===String(c.val))o.selected=true; vsel.appendChild(o); });
    vsel.addEventListener('change', ()=>{ c.val=vsel.value; renderAll(); });
    row.appendChild(vsel);
  } else {
    const chips=document.createElement('div'); chips.className='mschips';
    const sel=new Set(asArr(c.val).map(String));
    FL[c.field].opts().forEach(([v,l])=>{
      const ch=document.createElement('button'); ch.type='button'; ch.className='mschip'+(sel.has(v)?' on':''); ch.textContent=l;
      ch.addEventListener('click', ()=>{ sel.has(v)?sel.delete(v):sel.add(v); c.val=[...sel]; ch.classList.toggle('on'); renderAll(); });
      chips.appendChild(ch);
    });
    row.appendChild(chips);
  }
  const del=document.createElement('button'); del.className='c-del'; del.innerHTML='&times;'; del.title='Remove condition';
  del.addEventListener('click', ()=>{ g.conds.splice(ci,1); if(!g.conds.length) F().cohort.groups.splice(gi,1); renderCohort(); renderAll(); });
  row.appendChild(del);
  return row;
}
function buildAdvPanel(fg){
  const panel = document.createElement('div'); panel.className='panel adv open';
  panel.innerHTML = `<div class="adv-head"><div class="t">Advanced cohort filter
      <div class="d">AND within a group · OR across groups · applies to every card on the page</div></div>
    <div class="m" id="advMatch"></div></div>
    <div class="adv-body" id="adv-body"></div>
    <div class="adv-foot"><button class="btn-add-group" id="addGroup">+ OR group</button>
      <button class="btn-clear-cohort" id="clearCohort">Clear</button>
      <button data-done style="margin-left:auto;background:var(--mast);color:var(--mast-ink);border:0;border-radius:9px;padding:9px 18px;font-family:var(--f);font-size:12px;font-weight:700;cursor:pointer">Done</button></div>`;
  fg.appendChild(panel); closeOthers(panel);
  const fgr = fg.getBoundingClientRect(), w = Math.min(680, innerWidth-24);
  const leftVp = Math.max(12, Math.min(fgr.right-w, innerWidth-w-12));
  panel.style.left = (leftVp-fgr.left)+'px'; panel.style.right='auto'; panel.style.width = w+'px';
  panel.querySelector('#addGroup').addEventListener('click', ()=>{ F().cohort.groups.push({conds:[newCond()]}); renderCohort(); renderAll(); });
  panel.querySelector('#clearCohort').addEventListener('click', ()=>{ F().cohort.groups = []; renderCohort(); renderAll(); });
  panel.querySelector('[data-done]').addEventListener('click', ()=>panel.classList.remove('open'));
  renderCohort(); updateAdvUI();
}
function updateAdvUI(){
  const active = cohortActive();
  const nConds = F().cohort.groups.reduce((s,g)=>s+g.conds.length,0);
  const btn = document.querySelector('.fbtn[data-f="adv"]');
  if(btn){ btn.classList.toggle('has', active);
    btn.querySelector('.ftxt').innerHTML = active ? `<span class="cnt">${nConds}</span>` : ''; }
  const m = $('#advMatch'); if(!m) return;
  if(!active){ m.innerHTML = `<div class="v" style="color:var(--muted)">—</div><div class="l">no cohort set</div>`; return; }
  const n = rows().length;
  m.innerHTML = `<div class="v">${fmt(n)}</div><div class="l">of ${fmt(total())} ${noun()} match</div>`;
}

/* ============================================================
   chrome + render
   ============================================================ */
function updateScount(){
  $('#scount').innerHTML = `Showing <b>${fmt(rows().length)}</b> of <b>${fmt(total())}</b> ${noun()}`;
}
const NODATA = () => !DATA.accounts.n && !DATA.contacts.n;

/* The boot panel stands in for the whole board until the first read lands, and
   again if that read fails — better than a grid of cards all reading zero. The
   reason for a failure is held here so switching boards mid-failure redraws the
   explanation rather than dropping back to a spinner that is not spinning. */
let bootErr = null;
function renderBoot(failed, why){
  if(failed) bootErr = why || '';
  else if(bootErr != null) { failed = true; why = bootErr; }
  document.body.classList.add('booting');
  $('#kpis').innerHTML = '';
  $('#grid').innerHTML =
    `<div class="card boot${failed ? ' failed' : ''}"><div class="boot-in">`
    + `<div class="boot-spin"></div><div>`
    + `<div class="boot-t">${failed ? 'Data unavailable' : 'Loading portfolio…'}</div>`
    + `<div class="boot-d">${failed
        ? (why ? esc(why) + '. ' : '')
          + 'Nothing is cached in the page itself, so there is nothing to show yet. '
          + 'It retries automatically; the pill above forces a retry now.'
        : 'One moment.'}</div>`
    + `</div></div></div>`;
}

function renderAll(){
  if(NODATA()){ renderBoot(false); syncFilterButtons(); return; }
  document.body.classList.remove('booting');
  renderKpis(); renderCards(); updateScount(); updateAdvUI(); syncFilterButtons();
}

/* theme: system -> light -> dark -> system */
const THEMES = ['system','light','dark'], TICON = {system:'☼',light:'☀',dark:'☽'};
let themeIx = 0;
$('#themebtn').addEventListener('click', ()=>{
  themeIx = (themeIx+1)%3;

  else document.documentElement.setAttribute('data-theme', t);

$('#modes').addEventListener('click', e=>{

});
$$('.fbtn').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); buildPanel(b.dataset.f, b); }));
document.addEventListener('click', e=>{
  if(!e.target.isConnected) return;          // node was re-rendered away, not an outside click
  if(e.target.closest('.fgroup')) return;    // inside a panel
  $$('.panel').forEach(p=>p.classList.remove('open'));
});
$('#reset').addEventListener('click', ()=>{
  const f = F();
  FILTERS[S.mode].forEach(({key}) => f[key].clear());
  f.cohort.groups = [];
  if(isAcc()){ f.intentMin = 1; f.gWin = '12'; f.itWin = '12'; }
  $$('.panel').forEach(p=>p.remove());

});
window.addEventListener('mousemove', e=>{ if(tip.style.opacity>0) moveTip(e); });
window.addEventListener('keydown', e=>{ if(e.key==='Escape') $$('.panel').forEach(p=>p.classList.remove('open')); });

document.body.dataset.mode = S.mode;
$('#themebtn').innerHTML = TICON.system;

/* the filter rail sticks directly under the masthead, whose height changes when
   the mode switch wraps onto its own line — measure it instead of guessing */
const stick = () => document.documentElement.style.setProperty('--mastH',
  $('header.top').offsetHeight + 'px');
stick();
addEventListener('resize', stick);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(stick);

function renderChrome(){
  if(NODATA()){
    $('#mn-accounts').textContent = '—';
    $('#mn-contacts').textContent = '—';
    $('#foot-src').innerHTML = 'Source: Google Sheet &middot; read live, nothing cached in this page';
    return;

  $('#mn-accounts').textContent = fmt(DATA.accounts.n);

  $('#foot-src').innerHTML =
      `Source: Google Sheet &middot; <b>Accounts</b> ${fmt(DATA.accounts.n)}`

}
renderChrome();
renderAll();

/* ============================================================
   Live sync — re-derive from the sheet every REFRESH_MS
   ============================================================ */
/* Change detection fingerprints only the positional arrays and the dictionary
   lists. Object key order differs between the Python-built snapshot and the
   browser-built rebuild, so stringifying the whole payload would always
   "differ" on the first sync even when the sheet is untouched. */
const FP_KEYS = ['ind','loc','bnd','pri','sen','dep','rol','topic'];
const fingerprint = raw => JSON.stringify([raw.accounts.rows, raw.contacts.rows,
                                           FP_KEYS.map(k => raw.dict[k] || [])]);
let lastPayload = SNAPSHOT ? fingerprint(SNAPSHOT) : null;
let syncing = false, pendingRaw = null, lastSyncAt = null;

const liveEl = () => $('#live');
function setLive(state, detail){
  const el = liveEl(); if(!el) return;
  el.dataset.state = state;
  el.querySelector('.lt').textContent = ({syncing:'Syncing…', live:'Live', deferred:'Update ready',
    stale:'Stale', snapshot:'Snapshot'})[state] || state;
  el.title = detail || '';
}
const clockOf = d => d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

function panelOpen(){ return !!document.querySelector('.panel.open'); }

function applyRaw(raw){
  bootErr = null;
  const y = window.scrollY;
  adopt(raw);
  renderChrome();
  renderAll();
  window.scrollTo(0, y);
  lastSyncAt = new Date();
  setLive('live', `Sheet re-read at ${clockOf(lastSyncAt)} · refreshes every ${Math.round(REFRESH_MS/1000)}s`);
}

async function sync(){
  if(syncing) return;
  syncing = true;
  if(lastSyncAt === null) setLive('syncing', 'Loading…');
  try{
    // no-store only on the direct path; the proxy is meant to be edge-cached
    const opts = DIRECT ? {cache:'no-store'} : {};
    /* api/sheet.js answers failures with a plain-text reason. Surfacing that
       verbatim is the difference between "it broke" and a message that names
       what to go and fix. */
    const grab = tab => fetch(sourceUrl(tab), opts).then(async r => {
      if(!r.ok){
        const why = (await r.text().catch(()=>'')).trim().slice(0, 200);
        throw new Error(`the ${tab} tab responded ${r.status}${why ? ' — ' + why : ''}`);
      }
      return r.text();
    });
    const [accCsv, conCsv] = await Promise.all([grab('accounts'), grab('contacts')]);
    const raw = buildData(accCsv, conCsv);
    const payload = fingerprint(raw);
    if(payload === lastPayload){
      lastSyncAt = new Date();
      setLive('live', `No change · last checked ${clockOf(lastSyncAt)}`);
    } else {
      lastPayload = payload;
      // don't yank a filter panel out from under the user mid-selection
      if(panelOpen()){
        pendingRaw = raw;
        setLive('deferred', 'The sheet changed — applying as soon as this menu closes');
      } else {
        applyRaw(raw);
      }
    }
  }catch(err){
    console.warn('live sync failed:', err);
    if(lastSyncAt){
      setLive('stale', `Could not reach the sheet · showing data from ${clockOf(lastSyncAt)}`);
    } else {
      // nothing has ever loaded, so there is no earlier reading to fall back on
      setLive('stale', `Could not reach the sheet · ${err.message}`);
      renderBoot(true, err.message);
    }
  }finally{ syncing = false; }
}

/* a deferred update lands once every panel is closed */
setInterval(()=>{ if(pendingRaw && !panelOpen()){ const r = pendingRaw; pendingRaw = null; applyRaw(r); } }, 1000);
setInterval(()=>{ if(!document.hidden) sync(); }, REFRESH_MS);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) sync(); });
liveEl().addEventListener('click', sync);
setLive('syncing', 'Loading…');
sync();
</script>

<script>
/* Sprouts host: post live portfolio stats to the embedding app */
(function(){
  if (window.parent === window) return;
  var last = '';
  function post(){
    try{
      var acc = (typeof ACC !== 'undefined' && ACC) || [];
      if (!acc.length) return;
      var dict = (typeof DATA !== 'undefined' && DATA && DATA.dict && DATA.dict.pri) || [];
      var mix = {};
      for (var i = 0; i < acc.length; i++){
        var v = acc[i].pri, t = (dict[v] !== undefined) ? dict[v] : v;
        if (t == null || t === '') t = 'Unranked';
        mix[t] = (mix[t] || 0) + 1;
      }
      var con = (typeof CON !== 'undefined' && CON) ? CON.length : 0;
      var cov = (typeof DATA !== 'undefined' && DATA && DATA.summary && DATA.summary.contCov) || null;
      var msg = { type: 'sprouts-partner-stats', partner: 'jk', accounts: acc.length, contacts: con, tiers: mix, contCov: cov, at: Date.now() };
      var key = JSON.stringify([msg.accounts, msg.contacts, msg.tiers, cov && cov.email]);
      if (key === last) return;
      last = key;
      window.parent.postMessage(msg, '*');
    }catch(e){}
  }
  setInterval(post, 3000); setTimeout(post, 1200);
})();
</script>
